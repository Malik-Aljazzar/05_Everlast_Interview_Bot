# Interview-UI: statische React-App, /api geht im Docker-Netz direkt an die n8n-Webhooks /webhook/ui/*.
# Kein eigener Port: erreichbar nur über den nginx-Proxy unter https://everlast.mal-zeta.de, nur von der Admin-IP.
# Login kommt später.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Echte Client-IP vom nginx-Proxy im Docker-Netz übernehmen, damit die Allowlist greift
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    allow ADMIN_IP;
    deny all;

    # Docker-DNS zur Laufzeit, damit ein neu gestarteter n8n-Container gefunden wird
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/(.*)$ {
        set $n8n n8n:5678;
        proxy_pass http://$n8n/webhook/ui/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
