# Interview-UI unter everlast.mal-zeta.de (ersetzt seit 2026-11-22 HTTP auf Port 8080).
# Nur von der Admin-IP, die UI hat noch keinen Login. resolver und map stehen in n8n.conf.

server {
    listen 80;
    listen [::]:80;
    server_name everlast.mal-zeta.de;

    # Let's-Encrypt-Challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name everlast.mal-zeta.de;

    ssl_certificate     /etc/letsencrypt/live/everlast.mal-zeta.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/everlast.mal-zeta.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    allow ADMIN_IP;
    deny all;

    # Container ui (statische App, /api geht dort im Docker-Netz an n8n)
    set $ui http://ui:80;

    location / {
        proxy_pass $ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
}
