# n8n hinter nginx (ersetzt seit 2026-11-19 den Caddy-Proxy).
# Öffentlich nur die n8n-Webhooks (Vapi -> n8n, abgesichert per Header-Auth im Webhook-Node).
# Alles andere (UI, REST, MCP) nur von der Admin-IP, sonst 403.

# Docker-DNS: n8n zur Laufzeit auflösen, damit ein neu gestarteter n8n-Container gefunden wird
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.mal-zeta.de;

    # Let's-Encrypt-Challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n.mal-zeta.de;

    ssl_certificate     /etc/letsencrypt/live/n8n.mal-zeta.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.mal-zeta.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Vapi-Reports (Transkript, Nachrichten) können groß sein; n8n nimmt bis 16 MB an
    client_max_body_size 16m;

    set $n8n http://n8n:5678;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Push-Verbindung der UI und MCP-Streams nicht puffern; lange Workflows nicht abbrechen
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # API der Interview-UI: nur Admin-IP (die UI selbst ruft n8n intern im Docker-Netz auf)
    location /webhook/ui/ {
        allow ADMIN_IP;
        deny all;
        proxy_pass $n8n;
    }

    # Öffentlich: nur n8n-Webhooks
    location /webhook/ {
        proxy_pass $n8n;
    }
    location /webhook-test/ {
        proxy_pass $n8n;
    }

    # Alles andere (UI, REST, MCP): nur Admin-IP
    location / {
        allow ADMIN_IP;
        deny all;
        proxy_pass $n8n;
    }
}
